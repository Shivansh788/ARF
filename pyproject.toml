[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arf"
version = "0.1.0"
description = "Agent Red-teaming Framework for authorized defensive testing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "sqlalchemy>=2.0,<3",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
arf = "arf.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["arf"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
